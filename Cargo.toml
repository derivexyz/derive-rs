[package]
name = "derive-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bigdecimal = { version = "0.4.10", features = ["serde"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
ethers = { version = "2.0.14", features = ["eip712"] }
futures-util = "0.3.33"
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.21.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.24.0"
yawc = "0.3.3"

[workspace]
