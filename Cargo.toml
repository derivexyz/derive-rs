[package]
name = "derive-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "2.2.0", default-features = false, features = ["signer-local"] }
alloy-sol-types = "1.6.1"
anyhow = "1.0.104"
bigdecimal = { version = "0.4.10", features = ["serde", "serde-json"] }
bon = "3.9.3"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
# ethers = { version = "2.0.14", features = ["eip712"] }
futures-util = "0.3.33"
regress = "0.11.1"
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.21.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.0", features = ["serde"] }
yawc = "0.3.3"

[workspace]

[build-dependencies]
heck = "0.5.0"
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
regex = "1.13.1"
schemars = "0.8"
serde_json = "1.0.151"
syn = "3.0.3"
typify = "0.7.0"
