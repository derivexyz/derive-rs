[package]
name = "derive-rs"
version = "0.1.21"
edition = "2024"
license = "MIT"
homepage = "https://github.com/derivexyz/derive-rs"
description = "Rust SDK for Derive.xyz"

[dependencies]
alloy = { version = "2.5.0", default-features = false, features = ["signer-local", "providers", "reqwest", "contract"] }
bigdecimal = { version = "0.4.11", features = ["serde", "serde-json"] }
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive", "strum_macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
uuid = { version = "1.29.0", features = ["serde"] }
alloy-sol-types = "1.7.3"
anyhow = "1.0.104"
bon = "3.10.3"
bytes = "1.12.1"
dashmap = "6.2.1"
futures-util = "0.3.34"
regress = "0.12.0"
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
yawc = { version = "0.5.0", default-features = false, features = ["rustls-aws-lc-rs"] }

[workspace]

[build-dependencies]
heck = "0.5.0"
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
regex = "1.13.1"
schemars = "1.2"
serde_json = "1.0.154"
syn = "3.0.9"
typify = "0.8.0"

[dev-dependencies]
regex = "1.13.1"
tracing-subscriber = "0.3.23"
