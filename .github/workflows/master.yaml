name: Release

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Verify registry access
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          echo "registry_token_length=${#CARGO_REGISTRY_TOKEN}"
          http_code=$(curl -sS -o registry-me.json -w '%{http_code}' -H "Authorization: $CARGO_REGISTRY_TOKEN" https://crates.io/api/v1/me)
          echo "registry_me_http=$http_code"
          wc -c registry-me.json
          head -c 500 registry-me.json
